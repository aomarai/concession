# Backend services - Redis cache for TMDB API responses + JWT validation (dev environment)
# Use this compose file to run Redis locally alongside your backend during development
version: "3.8"

services:
  redis:
    image: redis:7-alpine@sha256:e9d40e0f4a2c6b9f4df6a1f5f9c8b0a8e8c4d2e7c3a1f5d6e9baaa
    container_name: redis-cache
    ports:
      - "6379:6379" # Standard Redis port accessible locally during dev
    volumes:
      - ./redis-data:/data
