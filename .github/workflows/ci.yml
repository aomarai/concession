name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test with coverage (enforces .coverage-threshold)
        run: ./scripts/coverage.sh --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No frontend yet; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the full stack (Postgres + API + frontend)
        run: docker compose --profile app up -d --build --wait --wait-timeout 240
      - name: Smoke test through the frontend container
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/lists/some-id | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/me)" = 401
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
