# Local development: `docker compose up -d` starts only Postgres; run the API
# and frontend from source (see docs/DEVELOPMENT.md).
#
# Full stack in containers (Postgres + API + frontend on http://localhost:8080):
#   cp .env.example .env   # then fill in the Google and TMDB values
#   docker compose --profile app up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-concession}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-concession}
      POSTGRES_DB: ${DB_NAME:-concession}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-concession}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    networks: [default, edge]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      PORT: "8080"
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_USER: ${DB_USER:-concession}
      DB_PASSWORD: ${DB_PASSWORD:-concession}
      DB_NAME: ${DB_NAME:-concession}
      # Plain-http local use needs non-secure cookies; set true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: lax
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Believe X-Forwarded-For only from the frontend container (nginx), which
      # has a fixed address on the "edge" network below, so no other address can
      # vouch for a client IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${FRONTEND_IP:-172.29.250.10}}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./frontend
    networks:
      edge:
        ipv4_address: ${FRONTEND_IP:-172.29.250.10}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

# The only path to the API is frontend -> backend over this network. It has a
# fixed subnet so the frontend's address is known (see TRUSTED_PROXIES). It is
# created only by the "app" profile; change APP_SUBNET and FRONTEND_IP if the
# range clashes with another Docker network on your machine.
networks:
  edge:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.250.0/24}

volumes:
  pgdata:
