# Local development services. Run the API with:
#   cd backend && DB_DRIVER=postgres DB_HOST=localhost go run ./cmd/server
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-concession}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-concession}
      POSTGRES_DB: ${DB_NAME:-concession}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-concession}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
